:root{
  --o50:#FFF3EE;--o100:#FEE5DC;--o200:#FECEBE;--o500:#FF714F;--o600:#E36044;--o700:#BF4C39;
  --y50:#FEFFF0;--y500:#FFFFB0;--y800:#C39642;--g500:#DDF2B9;--g800:#6E945C;--b200:#DDF6FF;--b500:#B4ECFF;--b600:#9DD8EF;--b800:#5490B1;
  --n50:#FCFCFC;--n100:#F5F5F5;--n200:#EBEBEB;--n300:#D9D9D9;--n400:#BDBDBD;--n500:#9E9E9E;--n600:#767676;--n700:#5C5C5C;--n900:#1A1A1A;
  --float:0 4px 16px rgba(0,0,0,.12);
  --sbh:54px; --bot:34px;
  color-scheme:light;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#E4E4E4;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--n900);
  display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.stage{position:relative;flex:none}
.phone{position:absolute;left:0;top:0;width:393px;height:852px;transform-origin:0 0;border-radius:56px;overflow:hidden;background:var(--n50);
  box-shadow:0 0 0 10px #161616,0 0 0 11px #3a3a3a,0 30px 80px rgba(0,0,0,.25);isolation:isolate}
.statusbar{position:absolute;left:0;right:0;top:0;height:54px;z-index:50;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 50px;font:600 17px/1 "Pretendard",system-ui;letter-spacing:-.4px}
.statusbar .island{position:absolute;left:133.5px;top:11px;width:126px;height:37px;border-radius:19px;background:#000}
.homebar{position:absolute;left:129.5px;bottom:8px;width:134px;height:5px;border-radius:3px;background:#000;z-index:50;pointer-events:none}
.mobile .statusbar,.mobile .homebar{display:none}
.mobile .phone{border-radius:0;box-shadow:none}
.mobile{--sbh:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}

/* screens */
.scr{position:absolute;inset:0;background:var(--n50);display:flex;flex-direction:column;will-change:transform}
.scr.white{background:#fff}
.scr>.top{padding-top:var(--sbh);flex:none;background:inherit;position:relative;z-index:3}
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative}
.body::-webkit-scrollbar{display:none}
.withtab .body{padding-bottom:calc(112px + var(--bot))}
.foot{flex:none;padding:12px 20px calc(16px + var(--bot));background:inherit}
.hdr{height:56px;display:flex;align-items:center;gap:4px;padding:0 8px;position:relative}
.hdr.line{border-bottom:1px solid var(--n200)}
.hdr h1{position:absolute;left:64px;right:64px;text-align:center;margin:0;font:700 17px/24px "Pretendard";letter-spacing:-.04em;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sp{flex:1}
.hdr .step{font:400 13px/18px "Pretendard";color:var(--n500);padding:0 12px}
.hdr.root{padding:0 20px;height:56px}
.hdr.root h1{position:static;text-align:left;font:700 24px/32px "Pretendard";letter-spacing:-.03em}
.ibtn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;flex:none;position:relative;color:var(--n900)}
.ibtn:active{background:var(--n100)}
.ibtn .dot{position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:#EF4444;border:2px solid #fff}
:focus-visible{outline:2px solid var(--o500);outline-offset:2px}

/* type */
.t-title{font:700 24px/32px "Pretendard";letter-spacing:-.03em;margin:0}
.t-sub1{font:700 20px/24px "Pretendard";letter-spacing:-.04em;margin:0}
.t-sub2{font:700 17px/24px "Pretendard";letter-spacing:-.04em;margin:0}
.t-body{font:400 15px/22px "Pretendard";letter-spacing:-.03em;margin:0}
.t-strong{font:600 16px/22px "Pretendard";margin:0}
.t-c1{font:400 14px/18px "Pretendard";letter-spacing:-.03em;margin:0}
.t-c2{font:400 13px/18px "Pretendard";letter-spacing:-.03em;margin:0}
.t-tab{font:500 11px/14px "Pretendard"}
.mut{color:var(--n500)}.mut6{color:var(--n600)}.mut7{color:var(--n700)}.or{color:var(--o500)}
.pad{padding:0 20px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}.g32{gap:32px}

/* buttons */
.btn{height:56px;width:100%;border:0;border-radius:12px;background:var(--o500);color:#FCFCFC;font:600 16px/22px "Pretendard";display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btn:active{background:var(--o600)}
.btn:disabled{background:var(--n200);color:var(--n400);cursor:default}
.btn.sec{background:var(--n100);color:var(--n900)}
.btn.sec:active{background:var(--n200)}
.btn.sec:disabled{background:var(--n100);color:var(--n400)}
.btn.sm{height:36px;width:auto;padding:0 14px;font-size:14px;border-radius:12px}
.btn.xs{height:32px;width:auto;padding:0 12px;font:400 13px/18px "Pretendard";border-radius:12px}
.tbtn{border:0;background:transparent;color:var(--n600);font:400 13px/18px "Pretendard";letter-spacing:-.03em;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 12px}
.tbtn:active{color:var(--n900)}
.lbtn{border:0;background:transparent;color:var(--n600);font:400 13px/18px "Pretendard";min-height:44px;padding:0 8px;display:inline-flex;align-items:center;gap:4px}
.danger{color:#E5484D}

/* input */
.fld{display:flex;flex-direction:column;gap:8px}
.fld label{font:400 13px/18px "Pretendard";color:var(--n600);letter-spacing:-.03em}
.inp{height:48px;width:100%;border:1px solid var(--n300);border-radius:12px;background:#fff;padding:0 16px;font:400 15px/22px "Pretendard";letter-spacing:-.03em;outline:none;transition:border-color .15s}
.inp::placeholder{color:var(--n400)}
.inp:focus{border-color:var(--o500)}
.inp.ok{border-color:var(--n300)}
.inpwrap{position:relative}
.inpwrap .inp{padding-right:64px}
.inpwrap .cnt,.inpwrap .ibtn{position:absolute;right:4px;top:2px}
.inpwrap .cnt{right:16px;top:15px;font:400 13px/18px "Pretendard";color:var(--n500)}
.hint{font:400 13px/18px "Pretendard";color:var(--n500);letter-spacing:-.03em;display:flex;gap:4px;align-items:center;margin:0}
.hint.good{color:var(--g800)}.hint.bad{color:#E5484D}

/* chips & tags */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--n200);background:var(--n50);font:400 13px/18px "Pretendard";letter-spacing:-.03em;display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--o500);border-color:var(--o500);color:#fff}
.chip.blue.on{background:var(--b500);border-color:var(--b600);color:var(--n900)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font:500 11px/14px "Pretendard";background:var(--n100);color:var(--n700);white-space:nowrap;gap:2px}
.tag.y{background:var(--y500);color:#7A5A1E}.tag.g{background:var(--g500);color:#486F37}.tag.b{background:var(--b500);color:#2E5B78}.tag.r{background:var(--o100);color:var(--o700)}
.tag.o{background:var(--o50);color:var(--o600);border:1px solid var(--o200)}
.tag.dark{background:var(--n900);color:#fff}

/* cards */
.card{border-top:1px solid var(--n200);border-bottom:1px solid var(--n200);padding:16px 0}
.area{border-radius:4px}
.divider{height:8px;background:var(--n100)}
.list>*+*{border-top:1px solid var(--n200)}
.lrow{display:flex;gap:12px;padding:16px 0;align-items:flex-start;width:100%;background:transparent;border:0;text-align:left}
.av{flex:none;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:transparent}
.av svg{width:100%;height:100%;display:block}
.av.avring{box-shadow:0 0 0 2px var(--o500)}
.menu{display:flex;align-items:center;gap:12px;height:64px;width:100%;border:0;background:transparent;padding:0;text-align:left;font:600 16px/22px "Pretendard"}
.menu .ic{width:20px;display:grid;place-items:center}
.menu .sp{flex:1}

/* toggle */
.tg{width:48px;height:28px;border-radius:999px;background:var(--n300);border:0;position:relative;flex:none;transition:background .18s;padding:0}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s}
.tg[aria-checked="true"]{background:var(--o500)}
.tg[aria-checked="true"]::after{transform:translateX(20px)}
.tg:disabled{opacity:.4}

/* check & radio */
.ck{width:24px;height:24px;border-radius:50%;border:0;background:var(--n200);display:grid;place-items:center;flex:none;color:#fff;transition:background .15s}
.ck.on{background:var(--o500)}
.radio{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--n400);flex:none;display:grid;place-items:center;background:#fff}
.radio.on{border-color:var(--o500)}
.radio.on::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--o500)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0;border:0;border-bottom:1px solid var(--n200);border-radius:0;background:transparent;text-align:left;font:400 15px/22px "Pretendard";letter-spacing:-.03em}
.opt.on{font-weight:600}
.opt .sp{flex:1}

/* tab bar: floating capsule */
.tabbar{position:absolute;left:20px;right:20px;bottom:calc(20px + var(--bot));height:64px;border-radius:999px;background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--float);display:flex;align-items:center;padding:0 14px;z-index:20;
  transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.tabbar.hide{transform:translateY(140%);opacity:0;pointer-events:none}
.tabbar button{flex:1;height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--n900);border-radius:999px}
.tabbar button[aria-current="page"]{color:var(--o500)}
.tabbar button svg{height:20px;width:auto}

/* floating things */
.fab{position:absolute;right:16px;bottom:calc(100px + var(--bot));width:56px;height:56px;border-radius:50%;border:0;background:var(--o500);color:#fff;box-shadow:var(--float);display:grid;place-items:center;z-index:10}
.fab:active{background:var(--o600)}
.pinbtn{position:absolute;right:20px;bottom:calc(100px + var(--bot));height:48px;padding:0 18px 0 14px;border-radius:999px;border:0;background:var(--o500);color:#fff;font:600 15px/22px "Pretendard";display:flex;align-items:center;gap:6px;box-shadow:var(--float);z-index:10}
.toast{position:absolute;left:50%;bottom:calc(100px + var(--bot));transform:translate(-50%,12px);background:var(--n900);color:#fff;border-radius:12px;padding:12px 16px;
  font:400 14px/18px "Pretendard";letter-spacing:-.03em;opacity:0;transition:opacity .2s,transform .2s;z-index:80;pointer-events:none;white-space:nowrap;max-width:353px;display:flex;gap:6px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* overlay: sheet & modal */
.ov{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.4);animation:fade .2s both}
.ov.out{animation:fadeo .2s both}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;padding:12px 20px calc(20px + var(--bot));max-height:88%;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1) both}
.ov.out .sheet{animation:down .2s ease-in both}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--n300);margin:0 auto 16px;flex:none}
.sheet .sbody{overflow-y:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.modal{position:absolute;left:41px;right:41px;top:50%;transform:translateY(-50%);background:#fff;border-radius:16px;padding:24px 20px 20px;animation:pop .22s cubic-bezier(.2,.8,.2,1) both;text-align:center}
.modal .acts{display:flex;gap:8px;margin-top:24px}
.sysalert{position:absolute;left:62px;right:62px;top:50%;transform:translateY(-50%);background:rgba(242,242,242,.97);border-radius:14px;overflow:hidden;text-align:center;animation:pop .22s both}
.sysalert p{margin:0}
.sysalert button{display:block;width:100%;height:44px;border:0;border-top:1px solid rgba(60,60,67,.29);background:transparent;color:#007AFF;font:400 17px/22px system-ui,"Pretendard"}
@keyframes fade{from{opacity:0}}@keyframes fadeo{to{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}@keyframes down{to{transform:translateY(100%)}}
@keyframes pop{from{opacity:0;transform:translateY(-50%) scale(.94)}}

/* transitions */
@keyframes inR{from{transform:translateX(100%)}}@keyframes outL{to{transform:translateX(-28%)}}
@keyframes inL{from{transform:translateX(-28%)}}@keyframes outR{to{transform:translateX(100%)}}
@keyframes inF{from{opacity:0}}
.a-inR{animation:inR .32s cubic-bezier(.2,.8,.2,1) both;z-index:2;box-shadow:-8px 0 24px rgba(0,0,0,.06)}
.a-outL{animation:outL .32s cubic-bezier(.2,.8,.2,1) both}
.a-inL{animation:inL .32s cubic-bezier(.2,.8,.2,1) both}
.a-outR{animation:outR .32s cubic-bezier(.2,.8,.2,1) both;z-index:2}
.a-inF{animation:inF .22s ease-out both;z-index:2}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* home */
.hello{padding:16px 20px;border-bottom:1px solid var(--n300)}
.nbr{background:var(--y50);border-bottom:1px solid var(--o500);padding:24px 20px 16px;position:relative;overflow:hidden}
.radar{position:relative;height:230px;margin:16px -20px 0;z-index:0}.nbr>*:not(.radar){position:relative;z-index:1}
.radar .ring{position:absolute;left:50%;top:115px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid #FEB49E;background:rgba(255,113,79,.1)}
.radar .nb{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;background:transparent;border-radius:50%}
.radar .nb .av{width:40px;height:40px;box-shadow:0 0 0 2px var(--o500)}
.radar .nb .on{position:absolute;right:-1px;bottom:1px;width:10px;height:10px;border-radius:50%;background:#5BC236;border:2px solid #fff}
.radar .me{position:absolute;left:50%;top:115px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.radar .me .av{position:relative;z-index:1}.radar .me .halo{position:absolute;top:-11px;width:62px;height:62px;border-radius:50%;background:rgba(255,113,79,.2)}
.radar .me .lbl{margin-top:-6px;background:var(--o500);color:#fff;border-radius:999px;padding:0 7px;font:500 11px/14px "Pretendard";position:relative;z-index:2}
.stat{background:#fff;border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,.05);display:flex;align-items:center;padding:12px 16px;position:relative;margin-top:16px}
.stat>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.stat>div+div{border-left:1px solid var(--n300)}.stat span{color:#666}.stat>div{padding:4px 0}
.stat b{font:700 24px/32px "Pretendard";color:var(--o500);letter-spacing:-.03em}
.msec{background:#fff;border-bottom:1px solid var(--o500);padding:24px 20px 16px}
.gsec{background:var(--b200);border-bottom:1px solid var(--n300);padding:24px 0 16px}
.gcards{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:0 20px}
.gcards::-webkit-scrollbar{display:none}
.gcard{flex:none;width:140px;height:112px;background:var(--n50);border:1px solid var(--n200);border-radius:16px;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.gcard .btn{height:32px;border-radius:12px;font:400 13px/18px "Pretendard";background:var(--b500);color:var(--n900);border:1px solid var(--b600)}
.gcard .btn:disabled{background:var(--n300);border-color:var(--n300);color:var(--n600)}
.rsec{padding:24px 20px 8px}

/* doors */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:16px 0;padding:0 20px}
.door{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:0;transition:opacity .2s}
.door .dl{font:700 17px/24px "Pretendard";letter-spacing:-.04em}
.door .dimg{width:150px;height:176px;position:relative}
.door .dimg{perspective:700px}
.door .dimg>div{position:absolute;inset:0}
.door .dimg svg{width:100%;height:100%}
.door .open{opacity:0;transition:opacity .25s ease .3s}
.door .closed{transform-origin:10% 50%;transition:transform .6s cubic-bezier(.3,.7,.2,1),opacity .2s ease .42s}
.door.isopen .open{opacity:1;transition:opacity .25s ease .28s}
.door.isopen .closed{transform:rotateY(-42deg);opacity:0}
.door:not(.isopen) .closed{transition:transform .5s cubic-bezier(.3,.7,.2,1),opacity .15s ease}
.door:not(.isopen) .open{transition:opacity .15s ease}
.door.dim{opacity:.45}
@keyframes knock{0%,100%{transform:none}20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(1deg)}}
.door.knock .dimg{animation:knock .32s ease-in-out}

/* map */
.mapwrap{position:relative;width:393px;height:725px}
.mapwrap>svg{position:absolute;inset:0}
.mk{position:absolute;transform:translate(-50%,-100%);border:0;padding:8px 10px;border-radius:12px;background:#fff;box-shadow:var(--float);text-align:left;display:flex;flex-direction:column;gap:4px;min-width:84px}
.mk::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.mk b{font:600 13px/18px "Pretendard";letter-spacing:-.03em}
.mk small{font:400 11px/14px "Pretendard";color:var(--n600)}
.mk.mine{background:var(--o500);color:#fff}
.mk.mine small{color:#FFE7DF}
.mk .badge{position:absolute;top:-10px;right:-6px;background:var(--o500);color:#fff;border-radius:999px;padding:1px 7px;font:500 11px/14px "Pretendard"}
.mk.mine .badge{background:var(--n900)}
.mk.empty{padding:6px 10px;min-width:0;opacity:.92}
.mk.empty b{color:var(--n600);font-weight:500}
.mynote{position:absolute;left:20px;right:20px;bottom:calc(100px + var(--bot));background:#fff;border-radius:16px;box-shadow:var(--float);padding:16px;display:flex;align-items:center;gap:12px;z-index:10}
.privacy{position:absolute;left:50%;transform:translateX(-50%);background:rgba(26,26,26,.78);color:#fff;border-radius:999px;padding:6px 12px;font:400 11px/14px "Pretendard";white-space:nowrap;display:flex;gap:4px;align-items:center}

/* questions */
.qitem{display:block;width:100%;text-align:left;border:0;background:#fff;padding:16px 20px;border-bottom:1px solid var(--n200)}
.qitem:active{background:var(--n100)}
.qmeta{display:flex;align-items:center;gap:6px;color:var(--n500);font:400 13px/18px "Pretendard"}
.ans{padding:16px 0;display:flex;flex-direction:column;gap:8px}
.thx{align-self:flex-start;height:32px;border-radius:999px;border:1px solid var(--n300);background:#fff;padding:0 12px;font:400 13px/18px "Pretendard";display:inline-flex;align-items:center;gap:4px;color:var(--n700)}
.thx.on{border-color:var(--o500);background:var(--o50);color:var(--o600)}
.composer{flex:none;display:flex;gap:8px;padding:12px 16px calc(12px + var(--bot));background:#fff;border-top:1px solid var(--n200)}
.composer .inp{flex:1}
.send{width:48px;height:48px;border-radius:12px;border:0;background:var(--o500);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{background:var(--n200);color:var(--n400)}

/* upload */
.upl{width:100%;aspect-ratio:1/1;max-height:280px;border:1.5px dashed var(--n300);border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;overflow:hidden;padding:0}
.upl .plus{width:48px;height:48px;border-radius:50%;background:var(--o100);color:var(--o500);display:grid;place-items:center}
.upl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.upl .rm{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;background:rgba(26,26,26,.7);color:#fff;border:0;display:grid;place-items:center}
.pphoto{width:96px;height:96px;border-radius:50%;background:var(--n100);border:0;display:grid;place-items:center;position:relative;overflow:visible;padding:0}
.pphoto img,.pphoto .av{width:96px;height:96px;border-radius:50%;object-fit:cover}
.pphoto .cam{position:absolute;right:-2px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:var(--o500);color:#fff;display:grid;place-items:center;border:2px solid #fff}

/* side panel (desktop) */
.side{width:240px;display:flex;flex-direction:column;gap:16px;margin-left:56px}
.side h2{font:700 28px/1.2 "Pretendard";margin:0;letter-spacing:-.02em}
.side p{margin:0;font:400 13px/1.6 "Pretendard";color:#6b6b6b;word-break:keep-all}
.side button{font:400 14px/1 "Pretendard";text-align:left;padding:14px;border-radius:12px;border:1px solid #d0d0d0;background:#fafafa;cursor:pointer}
.mobile+.side,.mobile~.side{display:none}
@media (max-width:700px){body{display:block;background:var(--n50)}.side{display:none}}

.glist .gsend{background:var(--b500);color:var(--n900);border:1px solid var(--b600)}.glist .gsend:disabled{background:var(--n300);border-color:var(--n300);color:var(--n600)}
.glist{border-top:1px solid var(--b600)}.glist>*+*{border-top-color:var(--b600)}
.sheet .opt:last-child{border-bottom:0}

.mhead{display:flex;justify-content:space-between;align-items:center;height:24px;margin-bottom:16px;position:relative}
.mhead .mdoor{position:absolute;right:0;top:-2px}
.mlink{border:0;background:none;color:var(--n500);font:400 13px/18px "Pretendard";letter-spacing:-.03em;min-height:24px;padding:0}
.gsec{padding:24px 0 16px}
.gchips{padding:0 16px}
.gchips .chip{height:auto;padding:6px 12px;background:var(--n50);border:1px solid var(--n200);color:var(--n900)}
.gchips .chip.on{background:var(--b500);border-color:var(--b600);color:var(--n900)}
.gcards{padding:0 16px;gap:12px}
.gcard{flex:none;min-width:140px;width:140px;height:100px;background:var(--n50);border:1px solid var(--n200);border-radius:16px;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.gbtn{height:32px;width:100%;border-radius:8px;border:1px solid var(--b600);background:var(--b500);color:var(--n900);font:400 13px/18px "Pretendard";letter-spacing:-.03em}
.gbtn:disabled{background:var(--n300);border-color:var(--n300);color:var(--n600);cursor:default}
.rsec{padding:24px 20px 16px;border-bottom:1px solid var(--n300)}
.rsec .lrow{padding:16px 0}
.rsec .av.avring{box-shadow:0 0 0 2px var(--o500)}

/* 핀 남기기 시트: 피그마 E2 화면 */
.pinsheet{border-radius:24px 24px 0 0;padding-top:12px}
.pinsheet .handle{margin-bottom:28px}
.pshead{display:flex;align-items:center;justify-content:space-between;margin:0 -12px 8px -12px;height:44px}
.psstep{font:400 14px/18px "Pretendard";color:var(--n500);padding-right:12px;letter-spacing:-.03em}
.psplaces{margin-top:40px;border-bottom:1px solid var(--n200)}
.psrow{display:flex;align-items:center;gap:12px;width:100%;height:79px;padding:0 16px;border:0;border-top:1px solid var(--n200);background:transparent;text-align:left}
.psrow:first-child{border-top:0}
.psrow .psic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;margin-left:-16px}
.psrow .pslbl{flex:1;font:500 16px/22px "Pretendard";letter-spacing:-.03em}
.psrow .radio{border-color:var(--n300)}
.psrow.on{background:var(--o50);border-top:1px solid var(--o500);box-shadow:0 1px 0 var(--o500);position:relative;z-index:1}
.psrow.on .psic{background:var(--o500)}
.psrow.on .radio{border-color:var(--o500)}
.pstags{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:40px}
.pstag{position:relative;height:128px;border:1px solid var(--n200);border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0}
.pstag .pscir{width:40px;height:40px;border-radius:50%;background:var(--n100);display:grid;place-items:center}
.pstag .pslbl{font:500 16px/22px "Pretendard";letter-spacing:-.03em}
.pstag.on{border:2px solid var(--o500);background:var(--o50)}
.pstag.on .pscir{background:var(--o500)}
.pstag .radio{position:absolute;right:12px;top:12px}
.psdur{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.psdur button{height:56px;border-radius:12px;border:1.5px solid var(--n300);background:#fff;font:400 15px/22px "Pretendard";color:var(--n700);letter-spacing:-.03em}
.psdur button.on{background:var(--o500);border-color:var(--o500);color:#fff}
.pssum{margin:48px 0 0;padding-bottom:24px;border-bottom:1px solid var(--n200);text-align:center;font:400 15px/22px "Pretendard";letter-spacing:-.03em;display:flex;justify-content:center;gap:16px}
.pssum span{color:var(--n400)}

/* 스플래시 모션: 로고는 온전한 모양 그대로, 통째로 부드럽게 떠오르고 이름과 소개가 차례로 나타남 */
.splash{background:var(--n50)}
.sa-wrap{position:relative;width:195.6px;height:158px}
.sa-wrap>div{position:absolute}
.sa-gate{left:66.8px;top:0;width:62px;height:62px;animation:saRise .9s cubic-bezier(.2,.8,.2,1) .15s both}
.sa-word{left:46.3px;top:78px;width:103px;height:42px;animation:saUp .6s cubic-bezier(.2,.8,.2,1) .85s both}
.sa-tag{left:0;top:136px;width:195.6px;height:22px;animation:saFade .6s ease-out 1.25s both}
@keyframes saRise{from{opacity:0;transform:translateY(14px) scale(.92)}}
@keyframes saUp{from{opacity:0;transform:translateY(10px)}}
@keyframes saFade{from{opacity:0}}
.intro .in-logo{animation:saUp .6s cubic-bezier(.2,.8,.2,1) .1s both}
.intro .in-tag{animation:saFade .5s ease-out .45s both}
.in-foot{animation:saUp .5s cubic-bezier(.2,.8,.2,1) .6s both}

/* 홈 레이더: 가운데에서 계속 퍼지는 물결 */
.radar .pulse{position:absolute;left:50%;top:115px;width:113px;height:113px;margin:-56.5px 0 0 -56.5px;border-radius:50%;border:2px solid rgba(255,113,79,.55);background:rgba(255,113,79,.08);
  animation:radarPulse 3.6s cubic-bezier(.25,.6,.35,1) infinite;pointer-events:none;opacity:0}
.radar .pulse.p2{animation-delay:1.2s}.radar .pulse.p3{animation-delay:2.4s}
@keyframes radarPulse{0%{transform:scale(.35);opacity:0}12%{opacity:.9}100%{transform:scale(3.7);opacity:0}}
.radar .nb,.radar .me{z-index:2}
/* 홈 미션 문 크게 */
.mhead .mdoor{top:-10px}
.mbody{padding-right:72px;min-height:72px}
/* 미션 완료 축하 */
.celebrate{position:relative}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;display:block}
.cbadge{position:relative;width:80px;height:80px;display:grid;place-items:center}
.ccheck{position:relative;z-index:1;width:80px;height:80px;border-radius:50%;background:var(--o500);color:#fff;display:grid;place-items:center;animation:cPop .6s cubic-bezier(.2,1.6,.4,1) .1s both}
.ccheck path{stroke-dasharray:24;stroke-dashoffset:24;animation:cDraw .4s ease-out .55s forwards}
.cring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--o500);opacity:0;animation:cRing .9s ease-out .35s both}
.cring.r2{animation-delay:.6s;border-color:#FFD84D}
.ctitle{animation:cUp .5s cubic-bezier(.2,1.4,.4,1) .55s both}
.celebrate .list,.celebrate .list+p{animation:cUp .5s cubic-bezier(.2,.8,.2,1) .8s both}
.celebrate .list+p{animation-delay:1s}
.cnum{display:inline-block}
.cnum.bump{animation:cBump .5s cubic-bezier(.2,1.8,.4,1)}
.cfoot{animation:cUp .5s cubic-bezier(.2,.8,.2,1) 1.1s both}
@keyframes cPop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes cDraw{to{stroke-dashoffset:0}}
@keyframes cRing{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(2.1)}}
@keyframes cUp{from{opacity:0;transform:translateY(14px)}}
@keyframes cBump{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}

/* 홈 레이더 첫 등장: 이웃들이 '나' 뒤에 포개져 '나'만 보이다가, 각자 자리로 퍼진 뒤 물결 시작 */
.radar.gather .nb{animation:nbSpread 1.1s cubic-bezier(.22,.9,.3,1) calc(.7s + var(--i) * .05s) both}
@keyframes nbSpread{
  0%{transform:translate(calc(-50% - var(--dx)),calc(-50% - var(--dy)))}
  100%{transform:translate(-50%,-50%)}}
.radar.gather .nb .on{animation:onIn .25s ease-out calc(1.6s + var(--i) * .05s) both}
@keyframes onIn{from{opacity:0;transform:scale(.4)}}
.radar.gather .pulse{animation-delay:2s}
.radar.gather .pulse.p2{animation-delay:3.2s}
.radar.gather .pulse.p3{animation-delay:4.4s}

.radar .me{width:40px;height:40px;display:block}
.radar .me .av{position:relative;z-index:1}
.radar .me .halo{left:-11px;top:-11px}
.radar .me .lbl{position:absolute;left:50%;top:100%;transform:translate(-50%,-6px);margin:0;white-space:nowrap}
.radar .nb{width:40px;height:40px;display:block;line-height:0}
/* 문: 뒤에 같은 크기의 어두운 문틀, 앞 문짝만 열림 (크기 그대로 유지) */
.door .doorway{filter:brightness(.42) saturate(1.3)}
.door .closed{transition:transform .65s cubic-bezier(.3,.7,.2,1)!important;opacity:1!important}
.door.isopen .closed{transform:rotateY(-58deg)}
/* 토글: 손잡이가 살짝 늘어났다 미끄러지는 움직임 */
.tg{transition:background .25s ease}
.tg::after{transition:transform .32s cubic-bezier(.3,1.5,.5,1),width .18s ease}
.tg:active:not(:disabled)::after{width:28px}
.tg[aria-checked="true"]:active:not(:disabled)::after{transform:translateX(14px)}
.door .doorway circle{display:none}

/* 미션 완료: 피그마 D4_2 정렬 */
.donewrap{display:flex;flex-direction:column;align-items:center;padding:48px 20px 24px;text-align:center}
.donewrap .cbadge{margin-bottom:24px}
.donewrap .ctitle{margin:0 0 32px}
.dbox{width:100%;border-radius:8px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:16px}
.dbox p{max-width:236px;word-break:keep-all}
.dbox.green{background:#EFF9DC}.dbox.peach{background:#FFF3EE}
.donefoot{flex:none;display:flex;flex-direction:column;gap:16px;padding:32px 24px calc(32px + var(--bot))}
.btn.dsec{background:#EBEBEB;color:var(--n700)}.btn.dsec:active{background:var(--n300)}
.celebrate .cup{animation:cUp .5s cubic-bezier(.2,.8,.2,1) .8s both}
.celebrate .cup+.cup{animation-delay:.92s}
.celebrate .cup2{animation:cUp .5s cubic-bezier(.2,.8,.2,1) 1.05s both}
/* 완료 아이콘: 앱 로고(반원 두 짝)가 한 번 열려 체크가 보였다가 다시 닫힘 */
.ccheck path{stroke-dasharray:none;stroke-dashoffset:0;animation:none}
.cgate{position:relative;width:40px;height:40px;perspective:240px;display:block}
.cdoor{position:absolute;top:0;width:20px;height:40px;display:block}
.cdoor.cl{left:0;transform-origin:0 50%;animation:cOpenL 1.6s cubic-bezier(.45,0,.25,1) .7s both}
.cdoor.cr{left:20px;transform-origin:100% 50%;animation:cOpenR 1.6s cubic-bezier(.45,0,.25,1) .7s both}
.cpeek{position:absolute;inset:4px;border-radius:50%;background:#fff;display:grid;place-items:center;opacity:0;animation:cPeek 1.6s ease .7s both}
.cpeek path{stroke-dasharray:24;stroke-dashoffset:24;animation:cDraw .35s ease-out 1.05s forwards}
@keyframes cOpenL{0%{transform:none}30%,70%{transform:rotateY(-80deg)}100%{transform:none}}
@keyframes cOpenR{0%{transform:none}30%,70%{transform:rotateY(80deg)}100%{transform:none}}
@keyframes cPeek{0%{opacity:0;transform:scale(.6)}25%,75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8)}}

/* 완료 아이콘: 원 없이 로고 실루엣만, 한 번 튀어나와 대문처럼 열렸다 닫힘 */
.donewrap .cbadge{width:80px;height:80px;display:grid;place-items:center;animation:cPop .6s cubic-bezier(.2,1.6,.4,1) .1s both}
.donewrap .cgate{width:72px;height:72px;perspective:320px}
.donewrap .cdoor{width:36px;height:72px}
.donewrap .cdoor.cr{left:36px}
.donewrap .cdoor.cl{animation:cOpenL 1.5s cubic-bezier(.45,0,.25,1) .75s both}
.donewrap .cdoor.cr{animation:cOpenR 1.5s cubic-bezier(.45,0,.25,1) .75s both}
@keyframes cOpenL{0%{transform:none}35%,62%{transform:rotateY(-70deg)}100%{transform:none}}
@keyframes cOpenR{0%{transform:none}35%,62%{transform:rotateY(70deg)}100%{transform:none}}

/* 내 핀 찍기: 위에서 떨어져 콕 박히고, 바닥에 자국이 퍼짐 */
.mk.drop{animation:pinDrop .75s cubic-bezier(.3,0,.4,1) .2s both;transform-origin:50% 100%}
@keyframes pinDrop{
  0%{transform:translate(-50%,-100%) translateY(-140px) scale(.9);opacity:0}
  15%{opacity:1}
  55%{transform:translate(-50%,-100%) translateY(0) scale(1.06,.86)}
  72%{transform:translate(-50%,-100%) translateY(-10px) scale(.97,1.04)}
  86%{transform:translate(-50%,-100%) translateY(0) scale(1.02,.97)}
  100%{transform:translate(-50%,-100%) scale(1)}}
.mk.drop .badge{animation:badgePop .35s cubic-bezier(.2,1.6,.4,1) .85s both}
@keyframes badgePop{from{transform:scale(0)}}
.pinhit{position:absolute;width:44px;height:14px;margin:-7px 0 0 -22px;border-radius:50%;background:rgba(255,113,79,.35);opacity:0;pointer-events:none;
  animation:pinHit .7s ease-out .6s both}
.pinhit::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(255,113,79,.6);animation:pinRing .8s ease-out .6s both}
@keyframes pinHit{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.8)}}
@keyframes pinRing{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(2.6)}}

/* 내 핀: 다른 이웃 핀과 다른 정보 */
.mk.mine{min-width:112px}
.mk.mine small{color:#fff;opacity:.92}
.mk .mytime{font:600 11px/14px "Pretendard";background:#fff;color:var(--o600);border-radius:999px;padding:2px 8px;align-self:flex-start}

.pbar{height:6px;border-radius:999px;background:var(--n200);overflow:hidden}
.pbar span{display:block;height:100%;border-radius:999px;background:var(--o500);transition:width .4s ease}
.mk.mkpreview{position:relative;transform:none;box-shadow:0 2px 8px rgba(0,0,0,.1);pointer-events:none}
.mk.mkpreview::after{display:none}

/* 안부 보내기: 옆으로 넘기기 */
.hscroll{cursor:grab;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.hscroll.dragging{cursor:grabbing;scroll-snap-type:none!important;user-select:none}
.hscroll.dragging *{pointer-events:none}
.gcards{scroll-snap-type:x mandatory;scroll-padding:0 16px}
.gcards>.gcard{scroll-snap-align:start}
.gchips{scroll-snap-type:x proximity;scroll-padding:0 16px}
.gchips>.chip{scroll-snap-align:start}
.hscroll.more-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
.hscroll.more-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px);mask-image:linear-gradient(90deg,transparent,#000 28px)}
.hscroll.more-l.more-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 40px),transparent)}
</style>
</head>

/* ---------- 화면 이동 ---------- */
const SCREENS = {};
let stack = [], busy = false;
const cur = () => stack[stack.length-1];
function mk(entry){
  const def = SCREENS[entry.name];
  const el = document.createElement('section');
  el.className = 'scr ' + (def.cls||'') + (def.tab ? ' withtab' : '');
  el.setAttribute('aria-label', def.title ? def.title(entry.p) : entry.name);
  el.innerHTML = def.render(entry.p);
  entry.el = el;
  return el;
}
function setTab(){
  const def = SCREENS[cur().name];
  toastEl.style.bottom = def.tab ? '' : 'calc(32px + var(--bot))';
  tabbar.classList.toggle('hide', !def.tab);
  tabbar.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === def.tab ? 'page' : 'false'));
  tabbar.querySelectorAll('button').forEach(b => { if (!def.tab) b.tabIndex = -1; else b.removeAttribute('tabindex'); });
}
function show(entry, anim, prev){
  if (entry.name === 'home') SCREENS.home.played = false;
  const el = mk(entry);
  if (prev && anim && !busy){
    busy = true;
    const m = {push:['a-inR','a-outL'], pop:['a-inL','a-outR'], fade:['a-inF','']}[anim];
    if (anim === 'pop') scrRoot.insertBefore(el, prev.el); else scrRoot.appendChild(el);
    el.classList.add(m[0]); if (m[1]) prev.el.classList.add(m[1]);
    setTimeout(() => { prev.el.remove(); el.classList.remove(m[0]); busy = false; }, 330);
  } else { scrRoot.appendChild(el); if (prev && prev.el) prev.el.remove(); }
  setTab();
  const def = SCREENS[entry.name]; if (def.mount) def.mount(el, entry.p);
}
function go(name, p={}, anim='push'){ if (busy) return; closeOv(true); const prev = cur(); stack.push({name, p}); show(cur(), anim, prev); }
function replace(name, p={}, anim='fade'){ if (busy) return; closeOv(true); const prev = stack.pop(); stack.push({name, p}); show(cur(), anim, prev); }
function back(){ if (busy) return; if (ovOpen()) return closeOv(); if (stack.length <= 1) return; const prev = stack.pop(); show(cur(), prev.p.modal ? 'fade' : 'pop', prev); }
function reset(name, p={}, anim='fade'){ if (busy) return; closeOv(true); const prev = cur(); stack.forEach(e => { if (e !== prev && e.el) e.el.remove(); }); stack = [{name, p}]; show(cur(), anim, prev); }
function rerender(){
  const e = cur(); if (!e || !e.el) return;
  const body = e.el.querySelector('.body'), st = body ? body.scrollTop : 0;
  const hs = [...e.el.querySelectorAll('.hscroll')].map(x => x.scrollLeft);
  e.el.innerHTML = SCREENS[e.name].render(e.p);
  const nb = e.el.querySelector('.body'); if (nb) nb.scrollTop = st;
  e.el.querySelectorAll('.hscroll').forEach((x,i) => x.scrollLeft = hs[i]||0);
  const def = SCREENS[e.name]; if (def.mount) def.mount(e.el, e.p);
}

let ovState = null;
const ovOpen = () => !!ovState;
function openOv(kind, renderFn, opts={}){
  closeOv(true);
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = kind === 'sheet' ? `<div class="sheet ${opts.sheetCls||''}" role="dialog" aria-modal="true"><div class="handle"></div><div class="sbody"></div></div>` : `<div class="${kind}" role="dialog" aria-modal="true"></div>`;
  ov.addEventListener('click', e => { if (e.target === ov && !opts.locked) closeOv(); });
  ovRoot.appendChild(ov);
  ovState = {ov, kind, renderFn, opts};
  renderOv();
  const f = ov.querySelector('button,input'); if (f && !opts.noFocus) setTimeout(()=>{ try{ f.focus({preventScroll:true}); }catch(e){} }, 50);
}
function renderOv(){
  if (!ovState) return;
  const box = ovState.kind === 'sheet' ? ovState.ov.querySelector('.sbody') : ovState.ov.firstElementChild;
  box.innerHTML = ovState.renderFn();
}
function closeOv(instant){
  if (!ovState) return; const {ov, opts} = ovState; ovState = null;
  if (opts.onClose) opts.onClose();
  if (instant) return ov.remove();
  ov.classList.add('out'); setTimeout(() => ov.remove(), 200);
}
function confirmBox(title, desc, okLabel, onOk, cancelLabel='취소'){
  openOv('modal', () => `<p class="t-sub2">${esc(title)}</p>${desc?`<p class="t-c1 mut6" style="margin-top:8px">${desc}</p>`:''}

}

function celebrate(el){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const num = el.querySelector('.cnum'); setTimeout(() => { if (num){ num.textContent = num.dataset.to; num.classList.add('bump'); } }, reduce ? 0 : 1500);
  if (reduce) return;
  const box = el.querySelector('.confetti'), badge = el.querySelector('.cbadge'); if (!box || !badge || !box.animate) return;
  const br = badge.getBoundingClientRect(), pr = box.getBoundingClientRect(), sc = br.width / 80;
  const cx = (br.left - pr.left) / sc + 40, cy = (br.top - pr.top) / sc + 40;
  const cols = ['#FF714F','#FFD84D','#9ED36A','#6CCBF0','#FF9E85','#FFB4A0'];
  const burst = (n, delay) => { for (let i = 0; i < n; i++){
    const p = document.createElement('i'); const w = 6 + Math.random()*6, round = Math.random() < .35;
    p.style.cssText = `left:${cx}px;top:${cy}px;width:${w}px;height:${round?w:w*0.45}px;background:${cols[i%cols.length]};border-radius:${round?'50%':'2px'}`;
    box.appendChild(p);
    const a = Math.random()*Math.PI*2, v = 90 + Math.random()*120, dx = Math.cos(a)*v, dy = Math.sin(a)*v - 60, r = (Math.random()*720-360);
    p.animate([{transform:'translate(-50%,-50%) scale(.4) rotate(0)', opacity:1},
               {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1) rotate(${r/2}deg)`, opacity:1, offset:.35},
               {transform:`translate(calc(-50% + ${dx*1.25}px), calc(-50% + ${dy + 420}px)) rotate(${r}deg)`, opacity:0}],
      {duration:1900 + Math.random()*900, delay, easing:'cubic-bezier(.15,.7,.35,1)', fill:'both'}).onfinish = () => p.remove();
  } };
  burst(56, 900); burst(36, 1400);
}

const withTxt = t => ({'아이':'아이와 함께 있어요','혼자':'혼자 있어요','반려동물':'반려동물과 함께 있어요','이웃':'이웃과 함께 있어요'})[t] || t;

let PS = null;

const durTxt = d => d<60 ? d+'분' : (d/60)+'시간';

/* ---------- 사진 줄이기 ---------- */
function readImg(file, cb){
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
    const m = 640, k = Math.min(1, m / Math.max(img.width, img.height)); const c = document.createElement('canvas');
    c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg', .8)); }; img.src = r.result; };
  r.readAsDataURL(file);
}

  place(d){ placeSheet(d.k); },
  mypin(){ closeOv(true); myPinSheet(); },
  mptag(){ MPS.editTag = !MPS.editTag; renderOv(); },
  mptagset(d){ S.pin.tag = d.k; MPS.editTag = false; save(); renderOv(); rerender(); toast('함께하는 사람을 바꿨어요'); },
  pinext(){ S.pin.until += 15*60000; S.pin.dur += 15; save(); renderOv(); rerender(); toast('15분 더 남겼어요'); },
  askhere(d){ closeOv(true); go('qwrite', {modal:true, f:{place:d.k, ptmp:d.k}}, 'fade'); },
  pinflow(d){ closeOv(true); pinFlow(d.k); },
  pinset(d){ PS[d.f] = d.f==='dur' ? +d.k : d.k; renderOv(); },
  pinstep(d){ if (+d.i > 0 && ((PS.step===1 && !PS.place) || (PS.step===2 && !PS.tag))){ toast(PS.step===1?'장소를 골라 주세요':'함께하는 사람을 골라 주세요'); return; } PS.step += +d.i; renderOv(); },
  pinsave(){ S.pin = {place:PS.place, tag:PS.tag, dur:PS.dur, until:Date.now()+PS.dur*60000}; save(); closeOv(); JUSTPIN = true; rerender(); JUSTPIN = false;
    const b = cur().el.querySelector('.body'), m = cur().el.querySelector('.mk.drop'); if (b && m) b.scrollTo({top: Math.max(0, parseFloat(m.style.top) - 260), behavior:'smooth'});
    setTimeout(() => toast('핀을 남겼어요'), 650); },
  leavepin(){ dropPin(); closeOv(); rerender(); toast('핀을 거뒀어요. 다음에 또 만나요'); },
  // 질문
  qflt(d){ cur().p.flt = d.k; rerender(); },
  openq(d){ go('qdetail', {id:d.k}); },
  qplace(){ qPlaceSheet(cur().p); },
  qptmp(d){ F(cur().p).ptmp = d.k; renderOv(); const i = ovRoot.querySelector('[data-in="pc"]'); if (i) i.focus(); },
  qplaceok(){ const f = F(cur().p); f.custom = f.ptmp==='__c'; f.place = f.custom ? f.pc.trim() : f.ptmp; closeOv(); rerender(); },
  qplacenone(){ const f = F(cur().p); f.place = null; f.ptmp = null; closeOv(); rerender(); },
  qplacerm(){ const f = F(cur().p); f.place = null; f.ptmp = null; f.custom = false; rerender(); },
  qpost(){ const f = F(cur().p); S.questions.unshift({id:'q'+Date.now(), text:f.qt.trim(), place: f.custom ? null : (f.place||null), customPlace: f.custom ? f.place : null, author:S.user.nick, time:'방금', answers:[], solved:false}); save(); reset('questions'); toast('질문을 올렸어요'); },
  qsolve(){ const q = S.questions.find(x=>x.id===cur().p.id); q.solved = !q.solved; save(); rerender(); toast(q.solved?'해결됐다고 표시했어요':'다시 답을 기다려요'); },
  thx(d){ const a = S.questions.flatMap(q=>q.answers).find(x=>x.id===d.k); S.thanked[a.id] = !S.thanked[a.id]; a.thanks += S.thanked[a.id] ? 1 : -1; save(); rerender(); },
  anspost(){ const p = cur().p, f = F(p), q = S.questions.find(x=>x.id===p.id); q.answers.push({id:'a'+Date.now(), author:S.user.nick, time:'방금', text:f.ans.trim(), thanks:0, my:true}); f.ans = ''; save(); rerender();
    const b = cur().el.querySelector('.body'); b.scrollTop = b.scrollHeight; toast('답을 남겼어요'); },
  ansdel(d){ confirmBox('이 답을 지울까요?', '지운 답은 다시 볼 수 없어요', '지우기', () => { S.questions.forEach(q => q.answers = q.answers.filter(a=>a.id!==d.k)); save(); rerender(); toast('답을 지웠어요'); }); },
  // 내 정보
  edstart(d){ const p = cur().p; p.edit = d.k; F(p).ed = S.user[d.k]; rerender(); const i = cur().el.querySelector('[data-in="ed"]'); if (i){ i.focus(); i.select(); } },
  edcancel(){ cur().p.edit = null; rerender(); },
  edsave(){ const p = cur().p, v = F(p).ed.trim(); const old = S.user.nick;
    if (p.edit==='nick'){ S.questions.forEach(q => { if (q.author===old) q.author = v; q.answers.forEach(a => { if (a.my) a.author = v; }); }); }
    S.user[p.edit] = v; p.edit = null; save(); rerender(); toast('바꿨어요'); },
  loginpick(){ openOv('sheet', () => `<div class="stack g8"><h2 class="t-sub1" style="margin-bottom:8px">로그인 방식</h2>${['카카오톡','네이버','구글','아이디'].map(m=>`<button class="opt ${S.user.login===m?'on':''}" data-a="loginset" data-k="${m}"><span class="sp">${m}</span><span class="radio ${S.user.login===m?'on':''}"></span></button>`).join('')}</div>`); },
  loginset(d){ S.user.login = d.k; save(); closeOv(); rerender(); toast(`${d.k}로 바꿨어요`); },
  reapt(){ go('apt', {re:true}); },
  logout(){ confirmBox('로그아웃할까요?', '', '로그아웃', () => { S.loggedIn = false; save(); reset('login'); }); },
  withdraw(){ confirmBox('정말 탈퇴할까요?', '쓴 글과 인증 기록이 모두 지워져요', '탈퇴하기', () => { try{ localStorage.removeItem('dudeuri-v5'); }catch(e){} S = seed(); reset('splash'); }); },
  kidgrade(){ const k = S.kids.find(x=>x.id===cur().p.id); openOv('sheet', () => `<div class="stack g8"><h2 class="t-sub1" style="margin-bottom:8px">학년 바꾸기</h2>${GRADES.map(g=>`<button class="opt ${k.grade===g?'on':''}" data-a="kidgradeset" data-k="${g}"><span class="sp">${g}</span><span class="radio ${k.grade===g?'on':''}"></span></button>`).join('')}</div>`); },
  kidgradeset(d){ S.kids.find(x=>x.id===cur().p.id).grade = d.k; save(); closeOv(); rerender(); },
  kidperm(d, el){ const k = S.kids.find(x=>x.id===cur().p.id); k.perms[d.k] = !k.perms[d.k]; save(); el.setAttribute('aria-checked', k.perms[d.k]); },
  kiddel(){ const k = S.kids.find(x=>x.id===cur().p.id); confirmBox(`${k.name} 계정을 지울까요?`, '아이 계정의 기록이 모두 지워져요', '지우기', () => { S.kids = S.kids.filter(x=>x!==k); save(); back(); toast('아이 계정을 지웠어요'); }); },
  ptab(d){ cur().p.tab = d.k; rerender(); },
  postdel(d){
    const txt = {q:['이 질문을 지울까요?','지우면 달린 답도 함께 보이지 않아요'], a:['이 답을 지울까요?','지운 답은 다시 볼 수 없어요'], c:['이 인증을 지울까요?','지운 인증은 지도에서도 사라져요']}[d.t];
    confirmBox(txt[0], txt[1], '지우기', () => {
      if (d.t==='q') S.questions = S.questions.filter(q=>q.id!==d.k);
      if (d.t==='a') S.questions.forEach(q => q.answers = q.answers.filter(a=>a.id!==d.k));
      if (d.t==='c') S.checkins = S.checkins.filter(c=>c.id!==d.k);
      save(); rerender(); toast('지웠어요'); });
  },
  notitg(d, el){ S.noti[d.k] = !S.noti[d.k]; save();
    el.setAttribute('aria-checked', d.k==='off' ? S.noti.off : (!S.noti.off && S.noti[d.k]));
    if (d.k === 'off') cur().el.querySelectorAll('.tg[data-k]').forEach(t => { if (t.dataset.k === 'off') return; t.disabled = S.noti.off; t.setAttribute('aria-checked', !S.noti.off && S.noti[t.dataset.k]); });
    toast(d.k==='off' ? (S.noti.off ? '모든 알림을 껐어요' : '알림을 다시 켰어요') : (S.noti[d.k] ? '알림을 켰어요' : '알림을 껐어요')); },
};

/* ---------- 이벤트 ---------- */
phone.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t || t.disabled || !phone.contains(t)) return;
  const fn = ACT[t.dataset.a]; if (fn){ e.preventDefault(); fn(t.dataset, t); }
});
phone.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.in) return;
  const e2 = cur(); const p = e2.p; F(p)[t.dataset.in] = t.value;
  const c = phone.querySelector(`[data-cnt="${t.dataset.in}"]`); if (c) c.textContent = `${[...t.value].length} / ${t.maxLength}`;
  const def = SCREENS[e2.name]; if (def.sync) def.sync(phone, p);
});
phone.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target; if (!t.dataset || !t.dataset.in) return;
  const btn = {ans:'[data-a="anspost"]', qt:'[data-a="qpost"]'}[t.dataset.in]; if (!btn) return;
  const b = phone.querySelector(btn); if (b && !b.disabled){ e.preventDefault(); b.click(); }
});
phone.addEventListener('change', e => {
  const t = e.target; if (!t.dataset || !t.dataset.file || !t.files[0]) return;
  readImg(t.files[0], url => {
    const p = cur().p;
    if (t.dataset.file === 'myphoto'){ S.user.photo = url; save(); toast('사진을 바꿨어요'); }
    else F(p)[t.dataset.file === 'mphoto' ? 'photo' : 'photo'] = url;
    rerender(); const def = SCREENS[cur().name]; if (def.sync) def.sync(phone, cur().p);
  });
});
/* 옆으로 넘기기: 손가락은 기본 스크롤, 마우스는 끌어서 넘기기 + 카드에 딱 맞게 멈추기 */
let drag = null;
phone.addEventListener('pointerdown', e => {
  const h = e.target.closest('.hscroll'); if (!h || e.pointerType !== 'mouse' || e.button !== 0) return;
  drag = {h, x:e.clientX, left:h.scrollLeft, moved:false, scale: h.getBoundingClientRect().width / h.offsetWidth || 1};
});
addEventListener('pointermove', e => {
  if (!drag) return; const dx = (e.clientX - drag.x) / drag.scale;
  if (!drag.moved && Math.abs(dx) > 5){ drag.moved = true; drag.h.classList.add('dragging'); }
  if (drag.moved){ drag.h.scrollLeft = drag.left - dx; e.preventDefault(); }
});
addEventListener('pointerup', () => {
  if (!drag) return; const d = drag; drag = null;
  if (!d.moved) return;
  d.h.classList.remove('dragging');
  const stop = ev => { ev.stopPropagation(); ev.preventDefault(); }; phone.addEventListener('click', stop, {capture:true, once:true}); setTimeout(() => phone.removeEventListener('click', stop, {capture:true}), 50);
  // 가장 가까운 항목에 맞춰 멈추기
  const items = [...d.h.children]; const pad = parseFloat(getComputedStyle(d.h).paddingLeft) || 0;
  let best = 0, bd = 1e9; items.forEach(it => { const t = it.offsetLeft - pad - d.h.offsetLeft; const dist = Math.abs(t - d.h.scrollLeft); if (dist < bd){ bd = dist; best = t; } });
  if (d.h.classList.contains('gcards')) d.h.scrollTo({left: Math.max(0, best), behavior:'smooth'});
});
// 양끝 흐림: 더 넘길 게 있는 쪽에만
function edgeFade(h){ const max = h.scrollWidth - h.clientWidth - 2; h.classList.toggle('more-r', h.scrollLeft < max); h.classList.toggle('more-l', h.scrollLeft > 2); }
phone.addEventListener('scroll', e => { if (e.target.classList && e.target.classList.contains('hscroll')) edgeFade(e.target); }, true);
new MutationObserver(() => phone.querySelectorAll('.hscroll').forEach(edgeFade)).observe(document.getElementById('screens'), {childList:true, subtree:true});

tabbar.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const n = TABROOT[b.dataset.tab]; if (cur().name === n){ const bd = cur().el.querySelector('.body'); if (bd) bd.scrollTo({top:0, behavior:'smooth'}); return; } reset(n); });
addEventListener('keydown', e => { if (e.key === 'Escape') back(); });
setInterval(() => { if (cur() && cur().name === 'map' && S.pin && !ovOpen()) rerender(); }, 30000);

/* 화면 맞추기 */
function fit(){
  const small = innerWidth <= 700;
  document.body.classList.toggle('mobile', small); stage.classList.toggle('mobile', small);
  if (small){ const s = innerWidth / 393; phone.style.transform = `scale(${s})`; phone.style.height = (innerHeight / s) + 'px'; stage.style.width = '100vw'; stage.style.height = '100vh'; stage.style.position = 'fixed'; stage.style.inset = '0'; }
  else { const s = Math.min((innerHeight - 64) / 852, 1.1); phone.style.transform = `scale(${s})`; phone.style.height = '852px'; stage.style.position = 'relative'; stage.style.inset = ''; stage.style.width = (393*s)+'px'; stage.style.height = (852*s)+'px'; }
}
addEventListener('resize', fit); fit();
document.getElementById('restart').addEventListener('click', () => { S = seed(); save(); reset('splash'); });

/* 화면마다 처음 값 맞추기 */
const _show = show;
show = function(entry, anim, prev){ _show(entry, anim, prev); const def = SCREENS[entry.name]; if (def.sync) def.sync(phone, entry.p); };
const _rr = rerender;
rerender = function(){ _rr(); const e = cur(); const def = SCREENS[e.name]; if (def.sync) def.sync(phone, e.p); };

stack = [{name:'splash', p:{}}]; _show(cur(), null, null);
})();
</script>
